<svg width="1400" height="760" viewBox="0 0 1400 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RIITS 圖文表格正式範本流程圖</title>
  <desc id="desc">一個包含三個步驟的簡報流程圖，從內容整理到設計排版再到發布。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="180" y1="140" x2="1220" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="-40" width="1480" height="840" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1400" height="760" rx="36" fill="url(#bg)"/>
  <rect x="80" y="70" width="1240" height="620" rx="30" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)"/>
  <text x="120" y="150" fill="#E2E8F0" font-family="Inter, 'Noto Sans TC', sans-serif" font-size="28" font-weight="700">RIITS 圖文表格正式範本</text>
  <text x="120" y="188" fill="#94A3B8" font-family="Inter, 'Noto Sans TC', sans-serif" font-size="18">圖片、表格與投影片區塊的標準組合</text>

  <g filter="url(#shadow)">
    <rect x="120" y="250" width="300" height="240" rx="24" fill="#111827" stroke="rgba(255,255,255,0.10)"/>
    <rect x="550" y="250" width="300" height="240" rx="24" fill="#111827" stroke="rgba(255,255,255,0.10)"/>
    <rect x="980" y="250" width="300" height="240" rx="24" fill="#111827" stroke="rgba(255,255,255,0.10)"/>
  </g>

  <circle cx="270" cy="295" r="28" fill="#22C55E"/>
  <text x="270" y="302" text-anchor="middle" fill="#052E16" font-family="Inter, sans-serif" font-size="20" font-weight="800">1</text>
  <text x="150" y="356" fill="#F8FAFC" font-family="Inter, 'Noto Sans TC', sans-serif" font-size="26" font-weight="700">內容整理</text>
  <text x="150" y="398" fill="#CBD5E1" font-family="Inter, 'Noto Sans TC', sans-serif" font-size="18">標題、日期、摘要</text>
  <text x="150" y="430" fill="#CBD5E1" font-family="Inter, 'Noto Sans TC', sans-serif" font-size="18">先把資訊梳理清楚</text>

  <circle cx="700" cy="295" r="28" fill="#F59E0B"/>
  <text x="700" y="302" text-anchor="middle" fill="#3B1D00" font-family="Inter, sans-serif" font-size="20" font-weight="800">2</text>
  <text x="580" y="356" fill="#F8FAFC" font-family="Inter, 'Noto Sans TC', sans-serif" font-size="26" font-weight="700">圖文排版</text>
  <text x="580" y="398" fill="#CBD5E1" font-family="Inter, 'Noto Sans TC', sans-serif" font-size="18">圖片、圖表、表格</text>
  <text x="580" y="430" fill="#CBD5E1" font-family="Inter, 'Noto Sans TC', sans-serif" font-size="18">讓重點一眼看懂</text>

  <circle cx="1130" cy="295" r="28" fill="#38BDF8"/>
  <text x="1130" y="302" text-anchor="middle" fill="#082F49" font-family="Inter, sans-serif" font-size="20" font-weight="800">3</text>
  <text x="1010" y="356" fill="#F8FAFC" font-family="Inter, 'Noto Sans TC', sans-serif" font-size="26" font-weight="700">發布交付</text>
  <text x="1010" y="398" fill="#CBD5E1" font-family="Inter, 'Noto Sans TC', sans-serif" font-size="18">放入 GitHub Pages</text>
  <text x="1010" y="430" fill="#CBD5E1" font-family="Inter, 'Noto Sans TC', sans-serif" font-size="18">可直接對客戶開啟</text>

  <path d="M430 370H520" stroke="#60A5FA" stroke-width="8" stroke-linecap="round"/>
  <path d="M520 370L496 354M520 370L496 386" stroke="#60A5FA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M860 370H950" stroke="#60A5FA" stroke-width="8" stroke-linecap="round"/>
  <path d="M950 370L926 354M950 370L926 386" stroke="#60A5FA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="120" y="540" width="1160" height="96" rx="22" fill="url(#card)" opacity="0.95"/>
  <text x="160" y="585" fill="#FFFFFF" font-family="Inter, 'Noto Sans TC', sans-serif" font-size="22" font-weight="700">圖片與表格都可以直接放進 slides.md</text>
  <text x="160" y="618" fill="rgba(255,255,255,0.92)" font-family="Inter, 'Noto Sans TC', sans-serif" font-size="18">圖片放 images/，表格可用 Markdown 或 HTML table，之後換素材就能快速重用。</text>
</svg>
